<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduled Issue Registry · Stellar Wave</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      border-radius: 0px !important;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #000000;
      color: #EDEDED;
    }
    .mono {
      font-family: 'Geist Mono', monospace;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #262626; }
    ::-webkit-scrollbar-thumb:hover { background: #525252; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-white selection:text-black">

  <!-- Header -->
  <header class="border-b border-neutral-800 bg-black/90 backdrop-blur sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-6 h-6 bg-white text-black font-bold text-xs flex items-center justify-center tracking-tighter mono">
          SW
        </div>
        <div>
          <h1 class="text-xs font-semibold uppercase tracking-widest text-white mono">
            Stellar Wave <span class="text-neutral-500 font-normal">/ Scheduled Registry</span>
          </h1>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <a href="/" class="text-xs mono uppercase text-neutral-400 hover:text-white transition flex items-center gap-1.5">
          <span>←</span>
          <span>Back to Issues</span>
        </a>
        <button onclick="exportCSV()" class="px-3 py-1 bg-white hover:bg-neutral-200 text-black text-xs mono uppercase font-bold transition">
          Export CSV
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full space-y-6">

    <!-- Metrics Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="border border-neutral-800 bg-neutral-950 p-5">
        <div class="text-[10px] mono uppercase tracking-widest text-neutral-500">Total Groups</div>
        <div id="metricTotal" class="text-2xl font-bold text-white mono mt-1">84</div>
      </div>
      <div class="border border-neutral-800 bg-neutral-950 p-5">
        <div class="text-[10px] mono uppercase tracking-widest text-neutral-500">Scheduled / Booked</div>
        <div id="metricReserved" class="text-2xl font-bold text-white mono mt-1">0</div>
      </div>
      <div class="border border-neutral-800 bg-neutral-950 p-5">
        <div class="text-[10px] mono uppercase tracking-widest text-neutral-500">Available Remaining</div>
        <div id="metricAvailable" class="text-2xl font-bold text-neutral-400 mono mt-1">84</div>
      </div>
    </div>

    <!-- Table Container -->
    <div class="border border-neutral-800 bg-black">
      <div class="p-4 border-b border-neutral-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <span class="w-1.5 h-1.5 bg-white"></span>
          <h2 class="text-xs mono uppercase tracking-wider font-bold text-white">Active Issue Reservations</h2>
        </div>
        <input 
          type="text" 
          id="bookingSearch" 
          placeholder="FILTER BY USER, GROUP, ISSUE..." 
          class="px-3 py-1.5 bg-neutral-950 border border-neutral-800 text-xs mono uppercase text-white placeholder-neutral-600 w-full sm:w-72 focus:outline-none focus:border-white transition"
        />
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs mono">
          <thead class="bg-neutral-950 text-neutral-400 uppercase tracking-widest border-b border-neutral-800 text-[10px]">
            <tr>
              <th class="py-3 px-4">Contributor</th>
              <th class="py-3 px-4">Group Name</th>
              <th class="py-3 px-4">Repository</th>
              <th class="py-3 px-4">Issues</th>
              <th class="py-3 px-4">UTC Timestamp</th>
            </tr>
          </thead>
          <tbody id="reservationsTableBody" class="divide-y divide-neutral-900 text-neutral-300">
            <tr>
              <td colspan="5" class="py-8 text-center text-neutral-600">Loading bookings...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let reservations = [];

    async function fetchReservations() {
      try {
        const res = await fetch('/api/admin/reservations');
        const data = await res.json();
        if (data.success) {
          reservations = data.reservations;
          document.getElementById('metricTotal').textContent = data.total_groups;
          document.getElementById('metricReserved').textContent = data.total_reserved;
          document.getElementById('metricAvailable').textContent = data.available_count;
          renderTable();
        }
      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    function renderTable() {
      const q = document.getElementById('bookingSearch').value.toLowerCase().trim();
      const filtered = reservations.filter(r => {
        if (!q) return true;
        const matchUser = r.username.toLowerCase().includes(q);
        const matchGroup = r.group_name.toLowerCase().includes(q);
        const matchRepo = r.repo.toLowerCase().includes(q);
        const matchIssues = r.issues.some(i => i.number.toString().includes(q));
        return matchUser || matchGroup || matchRepo || matchIssues;
      });

      const tbody = document.getElementById('reservationsTableBody');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-12 text-center text-neutral-600 uppercase">No scheduled reservations found</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(r => {
        const issuesLinks = r.issues.map(i => `
          <a href="${i.url}" target="_blank" class="px-1.5 py-0.5 border border-neutral-800 hover:border-white text-white">#${i.number}</a>
        `).join(' ');

        return `
          <tr class="hover:bg-neutral-950 transition">
            <td class="py-3 px-4 font-bold text-white">
              <a href="https://github.com/${escapeHtml(r.username)}" target="_blank" class="hover:underline">@${escapeHtml(r.username)}</a>
            </td>
            <td class="py-3 px-4 text-white uppercase">${escapeHtml(r.group_name)}</td>
            <td class="py-3 px-4 text-neutral-400">${escapeHtml(r.repo)}</td>
            <td class="py-3 px-4">${issuesLinks}</td>
            <td class="py-3 px-4 text-neutral-500">${r.created_at}</td>
          </tr>
        `;
      }).join('');
    }

    function exportCSV() {
      if (!reservations.length) {
        alert('No bookings to export.');
        return;
      }
      const headers = ['Username', 'Group Name', 'Repository', 'Issues', 'Reserved At UTC'];
      const rows = reservations.map(r => [
        r.username,
        `"${r.group_name}"`,
        r.repo,
        `"${r.issues.map(i => '#' + i.number).join(', ')}"`,
        r.created_at
      ]);

      const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `stellar_wave_scheduled_${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    document.getElementById('bookingSearch').addEventListener('input', renderTable);

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    fetchReservations();
    setInterval(fetchReservations, 5000);
  </script>
</body>
</html>
