<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduled Issue Registry · Stellar Wave</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      border-radius: 0px !important;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #000000;
      color: #EDEDED;
    }
    .mono {
      font-family: 'Geist Mono', monospace;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #262626; }
    ::-webkit-scrollbar-thumb:hover { background: #525252; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-white selection:text-black">

  <!-- Header -->
  <header class="border-b border-neutral-800 bg-black/90 backdrop-blur sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-6 h-6 bg-white text-black font-bold text-xs flex items-center justify-center tracking-tighter mono">
          SW
        </div>
        <div>
          <h1 class="text-xs font-semibold uppercase tracking-widest text-white mono">
            Stellar Wave <span class="text-neutral-500 font-normal">/ Scheduled Registry</span>
          </h1>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <a href="/" class="text-xs mono uppercase text-neutral-400 hover:text-white transition flex items-center gap-1.5">
          <span>←</span>
          <span>Back to Issues</span>
        </a>
        <button onclick="exportCSV()" class="px-3 py-1 bg-white hover:bg-neutral-200 text-black text-xs mono uppercase font-bold transition">
          Export CSV
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full space-y-6">

    <!-- Metrics Cards -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">
      <div class="border border-neutral-800 bg-neutral-950 p-4">
        <div class="text-[10px] mono uppercase tracking-widest text-neutral-500">Total Groups</div>
        <div id="metricTotal" class="text-xl font-bold text-white mono mt-1">84</div>
      </div>
      <div class="border border-neutral-800 bg-neutral-950 p-4">
        <div class="text-[10px] mono uppercase tracking-widest text-neutral-500">Total Booked</div>
        <div id="metricReserved" class="text-xl font-bold text-white mono mt-1">0</div>
      </div>
      <div class="border border-neutral-800 bg-neutral-950 p-4">
        <div class="text-[10px] mono uppercase tracking-widest text-neutral-400">Assigned on GitHub</div>
        <div id="metricAssigned" class="text-xl font-bold text-white mono mt-1">0</div>
      </div>
      <div class="border border-neutral-800 bg-neutral-950 p-4">
        <div class="text-[10px] mono uppercase tracking-widest text-neutral-500">Pending Assignment</div>
        <div id="metricPending" class="text-xl font-bold text-neutral-400 mono mt-1">0</div>
      </div>
      <div class="border border-neutral-800 bg-neutral-950 p-4">
        <div class="text-[10px] mono uppercase tracking-widest text-neutral-500">Completed</div>
        <div id="metricCompleted" class="text-xl font-bold text-neutral-400 mono mt-1">0</div>
      </div>
    </div>

    <!-- Table Container -->
    <div class="border border-neutral-800 bg-black">
      <div class="p-4 border-b border-neutral-800 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <!-- Filter Tabs & Hide Assigned Checkbox -->
        <div class="flex flex-wrap items-center gap-2">
          <div class="inline-flex border border-neutral-800 p-0.5 text-xs mono">
            <button onclick="setFilter('all')" id="tabAll" class="px-2.5 py-1 uppercase bg-white text-black font-semibold transition">
              All [<span id="tabCountAll">0</span>]
            </button>
            <button onclick="setFilter('unassigned')" id="tabUnassigned" class="px-2.5 py-1 uppercase text-neutral-400 hover:text-white transition">
              Unassigned [<span id="tabCountUnassigned">0</span>]
            </button>
            <button onclick="setFilter('assigned')" id="tabAssigned" class="px-2.5 py-1 uppercase text-neutral-400 hover:text-white transition">
              Assigned [<span id="tabCountAssigned">0</span>]
            </button>
          </div>

          <label class="flex items-center gap-1.5 text-xs mono text-neutral-400 hover:text-white cursor-pointer select-none ml-2">
            <input type="checkbox" id="hideAssignedToggle" onchange="toggleHideAssigned(this.checked)" class="accent-white cursor-pointer" />
            <span class="uppercase text-[11px]">Hide Assigned</span>
          </label>
        </div>

        <input 
          type="text" 
          id="bookingSearch" 
          oninput="renderTable()"
          placeholder="FILTER BY USER, GROUP, ISSUE..." 
          class="px-3 py-1.5 bg-neutral-950 border border-neutral-800 text-xs mono uppercase text-white placeholder-neutral-600 w-full sm:w-72 focus:outline-none focus:border-white transition"
        />
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs mono">
          <thead class="bg-neutral-950 text-neutral-400 uppercase tracking-widest border-b border-neutral-800 text-[10px]">
            <tr>
              <th class="py-3 px-4">Contributor</th>
              <th class="py-3 px-4">Group Name</th>
              <th class="py-3 px-4">Repository</th>
              <th class="py-3 px-4">Issues</th>
              <th class="py-3 px-4">Status</th>
              <th class="py-3 px-4">UTC Timestamp</th>
            </tr>
          </thead>
          <tbody id="reservationsTableBody" class="divide-y divide-neutral-900 text-neutral-300">
            <tr>
              <td colspan="6" class="py-8 text-center text-neutral-600">Loading bookings...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let reservations = [];
    let currentFilter = 'all';
    let hideAssigned = false;

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('#tabAll, #tabUnassigned, #tabAssigned').forEach(el => {
        el.className = 'px-2.5 py-1 uppercase text-neutral-400 hover:text-white transition';
      });
      if (filter === 'all') document.getElementById('tabAll').className = 'px-2.5 py-1 uppercase bg-white text-black font-semibold transition';
      if (filter === 'unassigned') document.getElementById('tabUnassigned').className = 'px-2.5 py-1 uppercase bg-white text-black font-semibold transition';
      if (filter === 'assigned') document.getElementById('tabAssigned').className = 'px-2.5 py-1 uppercase bg-white text-black font-semibold transition';
      renderTable();
    }

    function toggleHideAssigned(checked) {
      hideAssigned = checked;
      renderTable();
    }

    async function fetchReservations() {
      try {
        const res = await fetch('/api/admin/reservations');
        const data = await res.json();
        if (data.success) {
          reservations = data.reservations;
          document.getElementById('metricTotal').textContent = data.total_groups;
          document.getElementById('metricReserved').textContent = data.total_reserved;
          document.getElementById('metricAssigned').textContent = data.total_assigned || reservations.filter(r => r.is_assigned).length;
          const pendingCount = data.total_pending !== undefined ? data.total_pending : reservations.filter(r => !r.is_assigned).length;
          document.getElementById('metricPending').textContent = pendingCount;
          document.getElementById('metricCompleted').textContent = data.total_completed || 0;

          document.getElementById('tabCountAll').textContent = reservations.length;
          document.getElementById('tabCountAssigned').textContent = reservations.filter(r => r.is_assigned).length;
          document.getElementById('tabCountUnassigned').textContent = reservations.filter(r => !r.is_assigned).length;
          renderTable();
        }
      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    function renderTable() {
      const q = document.getElementById('bookingSearch').value.toLowerCase().trim();
      const filtered = reservations.filter(r => {
        if (hideAssigned && r.is_assigned) return false;
        if (currentFilter === 'assigned' && !r.is_assigned) return false;
        if (currentFilter === 'unassigned' && r.is_assigned) return false;

        if (!q) return true;
        const matchUser = r.username.toLowerCase().includes(q);
        const matchGroup = r.group_name.toLowerCase().includes(q);
        const matchRepo = r.repo.toLowerCase().includes(q);
        const matchIssues = r.issues.some(i => i.number.toString().includes(q));
        return matchUser || matchGroup || matchRepo || matchIssues;
      });

      const tbody = document.getElementById('reservationsTableBody');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-12 text-center text-neutral-600 uppercase">No scheduled reservations matching filter</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(r => {
        const issuesLinks = (r.issues || []).map(i => {
          const closed = i.state === 'closed';
          const cls = closed
            ? 'px-1.5 py-0.5 border border-neutral-800 text-neutral-600 line-through hover:border-neutral-600'
            : 'px-1.5 py-0.5 border border-neutral-800 hover:border-white text-white';
          return `<a href="${i.url}" target="_blank" title="${closed ? 'Closed on GitHub' : 'Open on GitHub'}" class="${cls}">#${i.number}</a>`;
        }).join(' ');

        const closedCount = r.issues_closed !== undefined ? r.issues_closed : (r.issues || []).filter(i => i.state === 'closed').length;
        const statusBadge = r.completion === 'completed'
          ? `<span class="px-2 py-0.5 border border-neutral-600 text-neutral-400 font-bold text-[10px] tracking-wider mono uppercase">COMPLETED</span>`
          : r.is_assigned
            ? `<span class="px-2 py-0.5 bg-white text-black font-bold text-[10px] tracking-wider mono uppercase">ASSIGNED</span>`
            : `<span class="px-2 py-0.5 border border-neutral-700 text-neutral-400 text-[10px] tracking-wider mono uppercase">PENDING</span>`;
        const closedBadge = closedCount > 0 && r.completion !== 'completed'
          ? ` <span class="text-neutral-500 text-[10px] mono uppercase">${closedCount}/${(r.issues || []).length} closed</span>`
          : '';

        return `
          <tr class="hover:bg-neutral-950 transition">
            <td class="py-3 px-4 font-bold text-white">
              <a href="https://github.com/${escapeHtml(r.username)}" target="_blank" class="hover:underline">@${escapeHtml(r.username)}</a>
            </td>
            <td class="py-3 px-4 text-white uppercase">${escapeHtml(r.group_name)}</td>
            <td class="py-3 px-4 text-neutral-400">${escapeHtml(r.repo)}</td>
            <td class="py-3 px-4">${issuesLinks}</td>
            <td class="py-3 px-4">${statusBadge}${closedBadge}</td>
            <td class="py-3 px-4 text-neutral-500">${r.created_at}</td>
          </tr>
        `;
      }).join('');
    }

    function exportCSV() {
      if (!reservations.length) {
        alert('No bookings to export.');
        return;
      }
      const headers = ['Username', 'Group Name', 'Repository', 'Issues', 'Closed Issues', 'Status', 'Reserved At UTC'];
      const rows = reservations.map(r => {
        const closed = r.issues_closed !== undefined ? r.issues_closed : (r.issues || []).filter(i => i.state === 'closed').length;
        const status = r.completion === 'completed' ? 'COMPLETED' : (r.is_assigned ? 'ASSIGNED' : 'PENDING');
        return [
          r.username,
          `"${r.group_name}"`,
          r.repo,
          `"${r.issues.map(i => '#' + i.number + (i.state === 'closed' ? ' (closed)' : '')).join(', ')}"`,
          `${closed}/${(r.issues || []).length}`,
          status,
          r.created_at
        ];
      });

      const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `stellar_wave_scheduled_${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    document.getElementById('bookingSearch').addEventListener('input', renderTable);

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    fetchReservations();
    setInterval(fetchReservations, 5000);
  </script>
</body>
</html>
